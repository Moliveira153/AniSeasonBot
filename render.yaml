# Render Blueprint — https://dashboard.render.com/docs/blueprint-spec
#
# NOTA: dockerTarget NÃO existe no schema do Render.
# Usamos runtime Python nativo (recomendado) ou Dockerfile.render (estágio único).
#
# Após o deploy, defina TELEGRAM_BOT_TOKEN no painel do web service.

services:
  # ── Redis (Key Value) ─────────────────────────────────────────────────────
  - type: keyvalue
    name: anime-bot-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── Bot (webhook + health + worker embutido) ──────────────────────────────
  - type: web
    name: anime-season-bot
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh scripts/start_web.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: BOT_MODE
        value: webhook
      - key: IS_RENDER
        value: "true"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anime-bot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: anime-bot-redis
          type: keyvalue
          property: connectionString
      - key: DEFAULT_LANGUAGE
        value: pt-BR
      - key: DEFAULT_TIMEZONE
        value: America/Sao_Paulo
      - key: LOG_LEVEL
        value: INFO
      - key: NOTIFICATION_CHECK_INTERVAL
        value: "300"
      - key: CACHE_TTL
        value: "3600"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: ADMIN_TELEGRAM_IDS
        sync: false

databases:
  - name: anime-bot-db
    plan: free
    databaseName: animebot
    user: animebot