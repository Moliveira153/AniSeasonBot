services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: animebot
      POSTGRES_PASSWORD: animebot
      POSTGRES_DB: animebot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animebot -d animebot"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  bot:
    build:
      context: .
      target: bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://animebot:animebot@postgres:5432/animebot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://animebot:animebot@postgres:5432/animebot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: base
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://animebot:animebot@postgres:5432/animebot
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data: